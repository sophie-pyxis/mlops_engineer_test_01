name: CI/CD Pipeline - Titanic MLOps

on:
  push:
    branches:
      - master

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Instalar dependências e rodar testes
        run: |
          pip install -r src/requirements.txt
          pip install pytest
          PYTHONPATH=src pytest tests/test_api.py

      - name: Configurar Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Criar bucket S3 se não existir
        run: |
          aws s3api create-bucket --bucket mlops-test-itau --region us-east-1 || true

      - name: Verificar e atualizar Layer de dependências no S3
        run: |
          LOCAL_HASH=$(md5sum src/requirements.txt | cut -d' ' -f1)
          REMOTE_HASH=$(aws s3 cp s3://mlops-test-itau/layer-hash.txt - 2>/dev/null || echo "")

          if [ "$LOCAL_HASH" != "$REMOTE_HASH" ]; then
            echo "Dependências alteradas — reconstruindo Layer..."
            mkdir -p layer/python
            pip install -r src/requirements.txt --target layer/python/
            cd layer && zip -r ../infra/layer.zip . && cd ..
            aws s3 cp infra/layer.zip s3://mlops-test-itau/layer.zip
            echo "$LOCAL_HASH" | aws s3 cp - s3://mlops-test-itau/layer-hash.txt
            echo "Layer atualizado no S3."
          else
            echo "Dependências sem alteração — reutilizando Layer existente no S3."
            aws s3 cp s3://mlops-test-itau/layer.zip infra/layer.zip
          fi

      - name: Empacotar código Lambda
        run: |
          cd src && zip -r ../infra/lambda.zip . --exclude "*.pyc" --exclude "__pycache__/*" && cd ..
          aws s3 cp infra/lambda.zip s3://mlops-test-itau/lambda.zip

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Aplicar Infra (Terraform)
        working-directory: ./infra
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          terraform init

          terraform import aws_dynamodb_table.titanic_table sobreviventes_titanic || true
          terraform import aws_iam_role.lambda_exec_role lambda_mlops_exec_role || true
          terraform import aws_iam_policy.lambda_policy arn:aws:iam::${AWS_ACCOUNT_ID}:policy/lambda_mlops_policy || true
          terraform import aws_lambda_function.titanic_ml titanic_inference_api || true

          API_ID=$(aws apigateway get-rest-apis --query "items[?name=='titanic-ml-api'].id" --output text)
          if [ -n "$API_ID" ]; then
            terraform import aws_api_gateway_rest_api.titanic_api $API_ID || true
            terraform import aws_api_gateway_stage.api_stage ${API_ID}/v1 || true
            STATEMENT_ID=$(aws lambda get-policy --function-name titanic_inference_api --query 'Policy' --output text | python3 -c "import json,sys; p=json.load(sys.stdin); print(p['Statement'][0]['Sid'])" 2>/dev/null)
            if [ -n "$STATEMENT_ID" ]; then
              terraform import aws_lambda_permission.apigw_invoke_permission titanic_inference_api/$STATEMENT_ID || true
            fi
          fi

          terraform apply -auto-approve