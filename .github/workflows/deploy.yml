name: CI/CD Pipeline - Titanic MLOps

on:
  push:
    branches:
      - master

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Instalar dependências e rodar testes
        run: |
          pip install -r src/requirements.txt
          pip install pytest
          PYTHONPATH=src pytest tests/test_api.py

      - name: Configurar Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Criar repositório ECR se não existir
        run: |
          aws ecr describe-repositories --repository-names titanic-inference-api 2>/dev/null || \
          aws ecr create-repository --repository-name titanic-inference-api

      - name: Build e push da imagem para o ECR
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          ECR_URI=${AWS_ACCOUNT_ID}.dkr.ecr.us-east-1.amazonaws.com/titanic-inference-api

          aws ecr get-login-password --region us-east-1 | \
            docker login --username AWS --password-stdin ${AWS_ACCOUNT_ID}.dkr.ecr.us-east-1.amazonaws.com

          LOCAL_HASH=$(cat src/requirements.txt Dockerfile | md5sum | cut -d' ' -f1)
          REMOTE_HASH=$(aws ecr list-tags-for-resource \
            --resource-arn arn:aws:ecr:us-east-1:${AWS_ACCOUNT_ID}:repository/titanic-inference-api \
            --query "tags[?Key=='build-hash'].Value" --output text 2>/dev/null || echo "")

          if [ "$LOCAL_HASH" != "$REMOTE_HASH" ]; then
            echo "Imagem desatualizada — realizando novo build..."
            docker build -t ${ECR_URI}:latest .
            docker push ${ECR_URI}:latest
            aws ecr tag-resource \
              --resource-arn arn:aws:ecr:us-east-1:${AWS_ACCOUNT_ID}:repository/titanic-inference-api \
              --tags Key=build-hash,Value=${LOCAL_HASH}
            echo "Nova imagem publicada no ECR."
          else
            echo "Imagem sem alterações — reutilizando imagem existente no ECR."
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Aplicar Infra (Terraform)
        working-directory: ./infra
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          terraform init

          terraform import aws_ecr_repository.titanic_repo titanic-inference-api || true
          terraform import aws_dynamodb_table.titanic_table sobreviventes_titanic || true
          terraform import aws_iam_role.lambda_exec_role lambda_mlops_exec_role || true
          terraform import aws_iam_policy.lambda_policy arn:aws:iam::${AWS_ACCOUNT_ID}:policy/lambda_mlops_policy || true
          terraform import aws_lambda_function.titanic_ml titanic_inference_api || true

          API_ID=$(aws apigateway get-rest-apis --query "items[?name=='titanic-ml-api'].id" --output text)
          if [ -n "$API_ID" ]; then
            terraform import aws_api_gateway_rest_api.titanic_api $API_ID || true
            terraform import aws_api_gateway_stage.api_stage ${API_ID}/v1 || true
            STATEMENT_ID=$(aws lambda get-policy --function-name titanic_inference_api --query 'Policy' --output text | python3 -c "import json,sys; p=json.load(sys.stdin); print(p['Statement'][0]['Sid'])" 2>/dev/null)
            if [ -n "$STATEMENT_ID" ]; then
              terraform import aws_lambda_permission.apigw_invoke_permission titanic_inference_api/$STATEMENT_ID || true
            fi
          fi

          terraform apply -auto-approve
