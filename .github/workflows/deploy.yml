name: CI/CD Pipeline - Titanic MLOps

on:
  push:
    branches:
      - master

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Instalar dependências e rodar testes
        run: |
          pip install -r src/requirements.txt
          pip install pytest
          PYTHONPATH=src pytest tests/test_api.py

      - name: Configurar Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deletar recursos recriáveis se existirem
        run: |
          # Lambda
          aws lambda delete-function --function-name titanic_inference_api 2>/dev/null && \
            echo "Lambda deletada." || echo "Lambda não existe, seguindo."

          # ECR — esvazia e deleta o repositório
          aws ecr batch-delete-image \
            --repository-name titanic-inference-api \
            --image-ids "$(aws ecr list-images --repository-name titanic-inference-api \
              --query 'imageIds[*]' --output json 2>/dev/null || echo '[]')" 2>/dev/null || true
          aws ecr delete-repository --repository-name titanic-inference-api --force 2>/dev/null && \
            echo "ECR deletado." || echo "ECR não existe, seguindo."

      - name: Criar repositório ECR e fazer build da imagem
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          ECR_URI=${AWS_ACCOUNT_ID}.dkr.ecr.us-east-1.amazonaws.com/titanic-inference-api

          aws ecr create-repository --repository-name titanic-inference-api

          aws ecr get-login-password --region us-east-1 | \
            docker login --username AWS --password-stdin ${AWS_ACCOUNT_ID}.dkr.ecr.us-east-1.amazonaws.com

          docker build -t ${ECR_URI}:latest .
          docker push ${ECR_URI}:latest

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Aplicar Infra (Terraform)
        working-directory: ./infra
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          terraform init

          # ECR criado pelo pipeline — importado para o Terraform não tentar recriar
          terraform import aws_ecr_repository.titanic_repo titanic-inference-api || true
          terraform import aws_ecr_lifecycle_policy.titanic_repo_policy titanic-inference-api || true

          # Recursos estáveis — importados para evitar recriação desnecessária
          terraform import aws_dynamodb_table.titanic_table sobreviventes_titanic || true
          terraform import aws_iam_role.lambda_exec_role lambda_mlops_exec_role || true
          terraform import aws_iam_policy.lambda_policy arn:aws:iam::${AWS_ACCOUNT_ID}:policy/lambda_mlops_policy || true

          # API Gateway — preservado para manter o endpoint fixo
          API_ID=$(aws apigateway get-rest-apis --query "items[?name=='titanic-ml-api'].id" --output text)
          if [ -n "$API_ID" ]; then
            terraform import aws_api_gateway_rest_api.titanic_api $API_ID || true
            terraform import aws_api_gateway_stage.api_stage ${API_ID}/v1 || true
          fi

          # Lambda foi recriada — aws_lambda_permission será criada pelo Terraform
          terraform apply -auto-approve