# Define o nome do fluxo de trabalho que aparecera no painel do GitHub Actions
name: CI/CD Pipeline - Titanic MLOps

# Especifica os gatilhos (triggers) que iniciam a execucao deste pipeline
on:
  # O pipeline sera executado sempre que ocorrer um evento de 'push' (envio de codigo)
  push:
    # Restringe o gatilho exclusivamente a ramificacao (branch) principal
    branches:
      # Branch 'main' e o padrao para codigo de producao
      - main

# Define os trabalhos (jobs) que serao executados de forma sequencial ou paralela
jobs:
  # Nome do job responsavel por testar a aplicacao e implantar a infraestrutura
  test-and-deploy:
    # Especifica o sistema operacional da maquina virtual (runner) cedida pelo GitHub
    runs-on: ubuntu-latest

    # Lista de passos (steps) sequenciais que compoem o trabalho
    steps:
      # Passo 1: Clona o repositorio para dentro da maquina virtual do GitHub
      - name: Checkout do código
        # Utiliza a acao oficial do GitHub para realizar o checkout do codigo
        uses: actions/checkout@v3

      # Passo 2: Prepara o ambiente instalando o interpretador Python
      - name: Configurar Python
        # Utiliza a acao oficial para configurar uma versao especifica do Python
        uses: actions/setup-python@v4
        # Define os parametros da acao
        with:
          # Define a versao 3.9, garantindo compatibilidade com o runtime da AWS Lambda
          python-version: '3.9'

      # Passo 3: Instala dependencias e garante a qualidade rodando testes unitarios
      - name: Instalar dependências e rodar testes
        # Executa comandos bash diretamente no runner
        run: |
          # Instala as dependencias do projeto listadas no arquivo requirements
          pip install -r src/requirements.txt
          # Instala o framework pytest para execucao dos testes
          pip install pytest
          # Executa a suite de testes unitarios; se falhar, o pipeline e interrompido aqui
          pytest tests/test_api.py

      # Passo 4: Autentica o runner na AWS usando chaves estaticas (Abordagem Classica)
      - name: Configurar Credenciais AWS
        # Utiliza a acao oficial da AWS para injetar credenciais no ambiente
        uses: aws-actions/configure-aws-credentials@v2
        # Define as credenciais mapeadas a partir dos Secrets do repositorio
        with:
          # Injeta a chave de acesso publica da AWS
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          # Injeta a chave privada (secret) da AWS de forma segura e mascarada
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # Define a regiao da AWS onde a infraestrutura sera provisionada
          aws-region: us-east-1

      # Passo 5: Instala e configura o binario do Terraform no runner
      - name: Setup Terraform
        # Utiliza a acao oficial da HashiCorp para instalar o Terraform
        uses: hashicorp/setup-terraform@v2

      # Passo 6: Executa o provisionamento da infraestrutura como codigo
      - name: Aplicar Infraestrutura (Terraform)
        # Muda o diretorio de execucao para a pasta onde estao os arquivos.tf
        working-directory:./infra
        # Executa os comandos do Terraform
        run: |
          # Inicializa o backend do Terraform e baixa os modulos dos provedores
          terraform init
          # Aplica as mudancas na AWS automaticamente sem pedir confirmacao manual
          terraform apply -auto-approve